<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mira — Voice Call</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0820;
    color: #e8d5ff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Purple grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(139,92,246,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,92,246,0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 60% 60% at 50% 40%, rgba(139,92,246,0.15) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    width: 100%;
    max-width: 420px;
    padding: 24px;
  }

  .mira-name {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.04em;
    background: linear-gradient(135deg, #c084fc, #a855f7, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .status-text {
    font-size: 13px;
    color: rgba(232,213,255,0.6);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    min-height: 20px;
  }

  /* Avatar ring */
  .avatar-ring {
    position: relative;
    width: 250px;
    height: 250px;
  }

  .avatar-ring::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(#7c3aed, #a855f7, #c084fc, #7c3aed);
    animation: spin 4s linear infinite;
  }

  .avatar-ring::after {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(139,92,246,0.25), transparent 70%);
  }

  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .avatar-circle {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    background: #1a0f2e;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Speaking pulse rings */
  .pulse-ring {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(139,92,246,0.35);
    animation: pulseOut 2s ease-out infinite;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 0;
  }
  .pulse-ring:nth-child(1) { inset: -18px; }
  .pulse-ring:nth-child(2) { inset: -18px; animation-delay: 0.65s; }
  .pulse-ring:nth-child(3) { inset: -18px; animation-delay: 1.3s; }
  .pulse-ring.active { opacity: 1; }

  @keyframes pulseOut {
    0%   { transform: scale(1);   opacity: 0.55; }
    100% { transform: scale(1.35); opacity: 0; }
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 6px;
  }

  .ctrl-btn {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    transition: transform 0.15s, background 0.2s;
  }

  .ctrl-btn:hover  { transform: scale(1.08); }
  .ctrl-btn:active { transform: scale(0.95); }

  .btn-mute {
    background: rgba(139,92,246,0.2);
    border: 1px solid rgba(139,92,246,0.4);
    color: #c084fc;
  }
  .btn-mute.muted {
    background: rgba(239,68,68,0.2);
    border-color: rgba(239,68,68,0.5);
    color: #f87171;
  }

  .btn-end {
    width: 66px;
    height: 66px;
    background: linear-gradient(135deg, #dc2626, #b91c1c);
    color: white;
    box-shadow: 0 4px 20px rgba(220,38,38,0.35);
  }

  .btn-camera {
    background: rgba(139,92,246,0.2);
    border: 1px solid rgba(139,92,246,0.4);
    color: #c084fc;
  }
  .btn-camera.on {
    background: rgba(139,92,246,0.4);
    border-color: #a855f7;
  }

  /* Start */
  .start-btn {
    padding: 14px 44px;
    border-radius: 50px;
    border: none;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.04em;
    box-shadow: 0 4px 24px rgba(139,92,246,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 32px rgba(139,92,246,0.5); }
  .start-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .timer {
    font-size: 13px;
    color: rgba(232,213,255,0.45);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.08em;
    min-height: 18px;
  }

  .context-tag {
    font-size: 11px;
    color: rgba(192,132,252,0.8);
    background: rgba(139,92,246,0.12);
    border: 1px solid rgba(139,92,246,0.25);
    border-radius: 20px;
    padding: 4px 14px;
    max-width: 340px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #selfVideo {
    position: fixed;
    bottom: 96px;
    right: 20px;
    width: 100px;
    height: 75px;
    border-radius: 12px;
    object-fit: cover;
    border: 2px solid rgba(139,92,246,0.5);
    display: none;
    z-index: 10;
    transform: scaleX(-1);
  }
</style>
</head>
<body>

<div class="container">

        <!-- Jacket / shoulders -->
        <path d="M28,230 L28,166 Q40,152 62,147 L83,142 Q100,163 117,142 L138,147 Q160,152 172,166 L172,230Z"

        <!-- Lapels -->

        <path d="M117,142 L127,164 L100,173Z" fill="#4338ca" opacity="0.85"/>

              fill="url(#hairG)"/>

              fill="url(#hairG)"/>
        <!-- Side bangs -->
        <path d="M55,76 Q48,96 53,118 Q59,84 70,76Z" fill="url(#hairG)"/>
        <path d="M145,76 Q152,96 147,118 Q141,84 130,76Z" fill="url(#hairG)"/>

        <!-- Eyebrows -->
        <path d="M72,75 Q80,70 91,72" stroke="#2d1060" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <path d="M109,72 Q120,70 128,75" stroke="#2d1060" stroke-width="2.5" stroke-linecap="round" fill="none"/>

        <!-- LEFT EYE group (id for blink targeting) -->
        <g id="eyeL">
          <ellipse cx="81" cy="91" rx="11" ry="8" fill="white"/>

          <circle  cx="83.5" cy="88.5" r="1.8" fill="white" opacity="0.9"/>
          <circle  cx="79"   cy="92.5" r="0.9" fill="white" opacity="0.5"/>
          <!-- Lash -->

          <circle  cx="121.5" cy="88.5" r="1.8" fill="white" opacity="0.9"/>
          <circle  cx="117"   cy="92.5" r="0.9" fill="white" opacity="0.5"/>
          <path d="M108,89 Q119,82 130,89" stroke="#120730" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <path d="M109,94 Q119,98 129,94" stroke="#120730" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.45"/>
        </g>
        <ellipse id="blinkR" cx="119" cy="91" rx="12" ry="7" fill="url(#skinG)" opacity="0"/>

        <!-- Nose (subtle) -->
        <ellipse cx="97"  cy="111" rx="2.2" ry="1.4" fill="#d4a090" opacity="0.3"/>

        <!-- Blush -->
        <ellipse cx="68"  cy="104" rx="14" ry="7" fill="url(#blushG)"/>
        <ellipse cx="132" cy="104" rx="14" ry="7" fill="url(#blushG)"/>

        <!-- MOUTH idle -->
        <g id="mouthIdle">
          <path d="M88,121 Q100,130 112,121" stroke="#c08878" stroke-width="2" stroke-linecap="round" fill="none"/>

        <g id="mouthSpeak" opacity="0">
          <path d="M88,119 Q94,116 100,116 Q106,116 112,119 Q106,128 100,129 Q94,128 88,119Z"
                fill="#d4726a"/>
          <path d="M88,119 Q94,116 100,117 Q106,116 112,119"
                stroke="#b05550" stroke-width="1" fill="none"/>
          <path d="M90,120 Q100,127 110,120 Q105,125 100,126 Q95,125 90,120Z"
                fill="#4a1515" opacity="0.7"/>

  </div>

  <!-- Context badge (shown when session loaded) -->
  <div class="context-tag" id="contextTag" style="display:none"></div>

  <div class="timer" id="timer"></div>

  <!-- Start screen -->
  <div id="startScreen">
    <button class="start-btn" id="startBtn" onclick="startCall()">Start Call with Mira</button>
  </div>

  <!-- In-call controls -->
  <div class="controls" id="callControls" style="display:none">
    <button class="ctrl-btn btn-mute" id="muteBtn" onclick="toggleMute()" title="Mute">🎙️</button>
    <button class="ctrl-btn btn-end"  onclick="endCall()"                   title="End call">📵</button>
    <button class="ctrl-btn btn-camera" id="camBtn" onclick="toggleCamera()" title="Camera">📷</button>
  </div>
</div>

<video id="selfVideo" autoplay muted playsinline></video>
<audio id="miraAudio" autoplay playsinline></audio>

<script>
// ── State ───────────────────────────────────────────────────────────────────
let pc           = null;
let localStream  = null;
let camStream    = null;
let audioCtx     = null;
let analyser     = null;
let isSpeaking   = false;
let isMuted      = false;
let isCamOn      = false;
let blinkTimer   = null;
let timerIv      = null;
let callStart    = null;
let speakRafId   = null;
let mouthPhase   = 0;
let sessionCfg   = null;

const SERVER = window.VOICERA_URL || window.location.origin;

// ── DOM ──────────────────────────────────────────────────────────────────────
const $  = id => document.getElementById(id);
const setStatus = t => { $('statusText').textContent = t; };

// ── Blink ────────────────────────────────────────────────────────────────────
function doBlink() {
  $('blinkL').setAttribute('opacity', '1');
  $('blinkR').setAttribute('opacity', '1');
  setTimeout(() => {
    $('blinkL').setAttribute('opacity', '0');
    $('blinkR').setAttribute('opacity', '0');
    scheduleBlink();
  }, 130);
}
function scheduleBlink() {
  clearTimeout(blinkTimer);
  blinkTimer = setTimeout(doBlink, 3200 + Math.random() * 4200);
}

// ── Mouth / speaking animation ────────────────────────────────────────────────
function animateMouth() {
  if (!isSpeaking) {
    $('mouthIdle').setAttribute('opacity', '1');
    $('mouthSpeak').setAttribute('opacity', '0');
    speakRafId = null;
    return;
  }
  mouthPhase += 0.20;
  const amp = 0.4 + 0.6 * Math.abs(Math.sin(mouthPhase));
  $('mouthIdle').setAttribute('opacity',  amp < 0.35 ? '1' : '0');
  $('mouthSpeak').setAttribute('opacity', amp < 0.35 ? '0' : String(amp.toFixed(2)));
  speakRafId = requestAnimationFrame(animateMouth);
}

function setSpeaking(on) {
  if (isSpeaking === on) return;
  isSpeaking = on;
  ['pulse1','pulse2','pulse3'].forEach(id => $( id).classList.toggle('active', on));
  if (on && !speakRafId) speakRafId = requestAnimationFrame(animateMouth);
}

// ── Audio analysis (detect Mira speaking) ─────────────────────────────────────
function startAnalysis(stream) {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser  = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    (function tick() {
      if (!analyser) return;
      analyser.getByteFrequencyData(data);
      const avg = data.reduce((a, b) => a + b, 0) / data.length;
      setSpeaking(avg > 12);
      requestAnimationFrame(tick);
    })();
  } catch (e) { console.warn('Audio analysis unavailable:', e); }
}

// ── Timer ─────────────────────────────────────────────────────────────────────
function startTimer() {
  callStart = Date.now();
  timerIv = setInterval(() => {
    const s = Math.floor((Date.now() - callStart) / 1000);
    $('timer').textContent =
      String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
  }, 1000);
}
function stopTimer() { clearInterval(timerIv); $('timer').textContent = ''; }

// ── ICE wait ──────────────────────────────────────────────────────────────────
function waitForIce(peer, ms) {
  return new Promise(resolve => {
    if (peer.iceGatheringState === 'complete') return resolve();
    const fn = () => { if (peer.iceGatheringState === 'complete') { peer.removeEventListener('icegatheringstatechange', fn); resolve(); } };
    peer.addEventListener('icegatheringstatechange', fn);
    setTimeout(() => { peer.removeEventListener('icegatheringstatechange', fn); resolve(); }, ms);
  });
}

// ── Session config ─────────────────────────────────────────────────────────────
async function loadSession() {
  const token = window.MIRA_SESSION_TOKEN;
  if (!token) return null;
  try {
    const r = await fetch(`/call/web/session/${token}/config`);
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch (e) { console.warn('Session load failed:', e); return null; }
}

// ── Start call ─────────────────────────────────────────────────────────────────
async function startCall() {
  const btn = $('startBtn');
  btn.disabled = true;
  btn.textContent = 'Connecting…';
  setStatus('Requesting microphone…');

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (e) {
    setStatus('Microphone access denied');
    btn.disabled = false; btn.textContent = 'Start Call with Mira';
    return;
  }

  pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  const remoteStream = new MediaStream();
  pc.ontrack = e => {
    remoteStream.addTrack(e.track);
    $('miraAudio').srcObject = remoteStream;
    startAnalysis(remoteStream);
  };

  const iceCandidates = [];
  pc.onicecandidate = e => { if (e.candidate) iceCandidates.push(e.candidate); };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await waitForIce(pc, 2000);

  setStatus('Reaching Mira…');

  // Build call body — use session config if available
  const cfg = sessionCfg || {};
  const body = {
    sdp: pc.localDescription.sdp,
    type: pc.localDescription.type,
    systemPrompt: cfg.systemPrompt || 'You are Mira, an empathetic AI executive coach. Keep responses concise and conversational.',
    greeting:     cfg.greeting     || "Hey! I'm Mira. What's on your mind?",
    llm: cfg.llm || { provider: 'openai',   model: 'gpt-4o-mini' },
    stt: cfg.stt || { provider: 'deepgram', language: 'English' },
    tts: cfg.tts || { provider: 'openai',   args: { voice: 'nova' } },
    ...(cfg.metadata ? { metadata: cfg.metadata } : {}),
  };

  let answer;
  try {
    const res = await fetch(SERVER + '/call/web', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`Server ${res.status}`);
    answer = await res.json();
  } catch (e) {
    setStatus('Connection failed — ' + e.message);
    cleanup();
    btn.disabled = false; btn.textContent = 'Start Call with Mira';
    return;
  }

  await pc.setRemoteDescription({ sdp: answer.sdp, type: answer.type || 'answer' });

  // Trickle ICE to server
  if (iceCandidates.length && answer.pc_id) {
    fetch(SERVER + '/call/web/patch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        pc_id: answer.pc_id,
        candidates: iceCandidates.map(c => ({ candidate: c.candidate, sdpMid: c.sdpMid, sdpMLineIndex: c.sdpMLineIndex })),
      }),
    }).catch(() => {});
  }

  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === 'connected') {
      setStatus('Connected');
      $('startScreen').style.display  = 'none';
      $('callControls').style.display = 'flex';
      startTimer();
      scheduleBlink();
      // Animate Mira speaking the greeting
      setTimeout(() => setSpeaking(true),  600);
      setTimeout(() => setSpeaking(false), 4500);
    } else if (s === 'failed' || s === 'disconnected' || s === 'closed') {
      endCall();
    }
  };
}

// ── End call ──────────────────────────────────────────────────────────────────
async function endCall() {
  setSpeaking(false);
  clearTimeout(blinkTimer);
  stopTimer();
  cleanup();

  $('blinkL').setAttribute('opacity','0');
  $('blinkR').setAttribute('opacity','0');
  $('callControls').style.display = 'none';
  $('startScreen').style.display  = 'flex';

  // Reset camera
  if (isCamOn) toggleCamera();

  // Reset mute
  isMuted = false;
  $('muteBtn').textContent = '🎙️';
  $('muteBtn').classList.remove('muted');

  const btn = $('startBtn');
  btn.disabled = false;
  btn.textContent = 'Start Call with Mira';
  setStatus('Call ended');
}

function cleanup() {
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (pc) { pc.ontrack = pc.onicecandidate = pc.onconnectionstatechange = null; pc.close(); pc = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; analyser = null; }
  $('miraAudio').srcObject = null;
}

// ── Mute ─────────────────────────────────────────────────────────────────────
function toggleMute() {
  if (!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
  $('muteBtn').textContent = isMuted ? '🔇' : '🎙️';
  $('muteBtn').classList.toggle('muted', isMuted);
}

// ── Camera (PiP) ─────────────────────────────────────────────────────────────
async function toggleCamera() {
  const sv = $('selfVideo');
  const cb = $('camBtn');
  if (!isCamOn) {
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video: true });
      sv.srcObject = camStream;
      sv.style.display = 'block';
      cb.classList.add('on');
      isCamOn = true;
    } catch (e) { setStatus('Camera unavailable'); }
  } else {
    if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
    sv.style.display = 'none';
    cb.classList.remove('on');
    isCamOn = false;
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
(async () => {
  sessionCfg = await loadSession();
  if (sessionCfg) {
    const tag   = $('contextTag');
    const label = (sessionCfg.metadata && sessionCfg.metadata.context) || sessionCfg.greeting || 'Session ready';
    tag.textContent = label;
    tag.style.display = 'block';
    setStatus('Session ready — connecting…');
    setTimeout(() => startCall(), 700);
  }
})();
</script>
